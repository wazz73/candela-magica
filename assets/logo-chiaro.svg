<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" role="img" aria-label="Candela Magica — candele artigianali">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&amp;family=Inter:wght@600&amp;display=swap');
    .w { font-family: "Cormorant Garamond", Georgia, serif; font-size: 44px; font-weight: 600; fill: #2a1f33; }
    .m { font-style: italic; fill: #d4860f; }
    .t { font-family: Inter, Arial, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 4px; fill: #7a6b85; }
  </style>
  <svg x="0" y="8" width="80" height="80" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cm-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#f08a1c"/>
    </linearGradient>
    <linearGradient id="cm-wax" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3cfb3"/>
      <stop offset=".4" stop-color="#fbf3e6"/>
      <stop offset="1" stop-color="#d6c0a3"/>
    </linearGradient>
  </defs>
  <!-- fiamma -->
  <path d="M32 4c6 9 11 14.5 11 22.5a11 11 0 0 1-22 0C21 18.5 26 13 32 4z" fill="url(#cm-flame)"/>
  <path d="M32 17c2.6 4 4.6 6.4 4.6 10a4.6 4.6 0 0 1-9.2 0c0-3.6 2-6 4.6-10z" fill="#fff6dc"/>
  <!-- stoppino -->
  <rect x="31" y="35" width="2" height="5" rx="1" fill="#3a2a1e"/>
  <!-- candela -->
  <path d="M21 40h22v18a3 3 0 0 1-3 3H24a3 3 0 0 1-3-3z" fill="url(#cm-wax)"/>
  <path d="M21 40h22v4c0 1.5-1.2 2.5-2.4 2.5-1.3 0-2.2-1-2.2-2.5v-1H28v4.5c0 1.4-1.1 2.5-2.5 2.5S23 48.9 23 47.5V44h-2z" fill="#fffaf0"/>
  <!-- scintille -->
  <path d="M51 9l1.4 3.6L56 14l-3.6 1.4L51 19l-1.4-3.6L46 14l3.6-1.4z" fill="#ffd27a"/>
  <path d="M13 22l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#ffd27a" opacity=".8"/>
  <circle cx="49" cy="28" r="1.3" fill="#ffd27a" opacity=".7"/>
</svg>
  <text x="92" y="56" class="w">Candela <tspan class="m">Magica</tspan></text>
  <text x="95" y="78" class="t">CANDELE ARTIGIANALI</text>
</svg>
